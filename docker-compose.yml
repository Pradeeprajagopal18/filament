# Settings come from a .env file next to this one (copy .env.example). Never commit .env.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ignite
      POSTGRES_PASSWORD: ignite
      POSTGRES_DB: ignite
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    # Every IGNITE_* setting, ANTHROPIC_* and proxy variables in .env reach the container.
    env_file:
      - path: .env
        required: false
    environment:
      IGNITE_DATABASE_URL: postgresql+psycopg://ignite:ignite@db:5432/ignite
      IGNITE_CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["8000:8000"]
    volumes: [ignite-data:/data]
    depends_on: [db]

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_TARGET: http://api:8000
    volumes: [./frontend:/app]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  ignite-data:
