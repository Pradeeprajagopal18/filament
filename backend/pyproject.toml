[project]
name = "filament"
version = "0.1.0"
description = "Filament — agentic software delivery platform with shared team memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "mcp>=2.0",
    "anyio>=4.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
fil = "filament.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filament"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends / typer Option defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
# Pattern tables (regexes, framework/vendor maps, wireframe CSS) read better unwrapped.
"filament/repos/*" = ["E501"]
"scripts/demo_repos.py" = ["E501"]  # embedded sample source files
