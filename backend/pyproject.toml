[project]
name = "igniteai"
version = "0.1.0"
description = "Ignite — agentic software delivery platform with shared team memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "mcp>=2.0",
    "anyio>=4.4",
    "pyjwt[crypto]>=2.8",
    "ldap3>=2.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Symbol-level code graph during repo scans (tree-sitter, code-only, no LLM).
code = ["tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.23", "tree-sitter-javascript>=0.23",
        "tree-sitter-typescript>=0.23", "tree-sitter-java>=0.23", "tree-sitter-go>=0.23",
        "networkx>=3.3"]
# Knowledge (RAG): a local embedding model and PDF reading. Everything runs on your servers.
knowledge = ["fastembed>=0.4", "pypdf>=4.0"]
dev = ["pytest>=8.2", "ruff>=0.5", "igniteai[code]", "pypdf>=4.0"]

[project.scripts]
ign = "igniteai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["igniteai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends / typer Option defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
# Pattern tables (regexes, framework/vendor maps, wireframe CSS) read better unwrapped.
"igniteai/repos/*" = ["E501"]
"scripts/demo_repos.py" = ["E501"]  # embedded sample source files
